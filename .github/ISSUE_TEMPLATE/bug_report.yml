name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real account numbers, balances, statements or secrets. For security issues, use a private security advisory instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Shown in Pengaturan > Tentang Montra.
  - type: input
    id: env
    attributes:
      label: Browser and device
